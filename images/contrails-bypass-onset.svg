<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Ice supersaturation onset versus bypass ratio</title>
<desc id="desc">Centreline location where ice saturation ratio first exceeds one, for bypass temperatures 240, 270, and 300 kelvin.</desc>
<style>
text{font-family:Inter,Arial,sans-serif;fill:#b9c3cf;font-size:16px} .title{fill:#f4f6f8;font-size:24px;font-weight:600}
.grid{stroke:#28313d;stroke-width:1} .axis{stroke:#718096;stroke-width:1.5} .line{fill:none;stroke-width:3} .fill{stroke:none}
.s240.line{stroke:#9ccfff} .s240.fill{fill:#9ccfff} .s270.line{stroke:#f4f6f8} .s270.fill{fill:#f4f6f8} .s300.line{stroke:#7f8b99} .s300.fill{fill:#7f8b99}
.note{fill:#9ccfff;font-weight:600}
</style>
<rect width="100%" height="100%" fill="#0e1116"/>
<text x="90" y="32" class="title">Bypass conditions shift supersaturation onset upstream</text>
<line x1="90" y1="480.0" x2="960" y2="480.0" class="grid"/><text x="76" y="485.0" text-anchor="end">0.10</text><line x1="90" y1="373.8" x2="960" y2="373.8" class="grid"/><text x="76" y="378.8" text-anchor="end">0.12</text><line x1="90" y1="267.5" x2="960" y2="267.5" class="grid"/><text x="76" y="272.5" text-anchor="end">0.14</text><line x1="90" y1="161.2" x2="960" y2="161.2" class="grid"/><text x="76" y="166.2" text-anchor="end">0.16</text><line x1="90" y1="55.0" x2="960" y2="55.0" class="grid"/><text x="76" y="60.0" text-anchor="end">0.18</text><line x1="141.2" y1="55" x2="141.2" y2="480" class="grid"/><text x="141.2" y="508" text-anchor="middle">2.5</text><line x1="494.3" y1="55" x2="494.3" y2="480" class="grid"/><text x="494.3" y="508" text-anchor="middle">5.95</text><line x1="908.8" y1="55" x2="908.8" y2="480" class="grid"/><text x="908.8" y="508" text-anchor="middle">10</text>
<line x1="90" y1="480" x2="960" y2="480" class="axis"/><line x1="90" y1="55" x2="90" y2="480" class="axis"/>
<polyline points="141.2,297.8 494.3,339.2 908.8,414.7" class="s240 line"/><polyline points="141.2,198.4 494.3,235.6 908.8,292.5" class="s270 line"/><polyline points="141.2,100.2 494.3,117.2 908.8,161.2" class="s300 line"/><circle cx="141.2" cy="297.8" r="6" class="s240 fill"/><circle cx="494.3" cy="339.2" r="6" class="s240 fill"/><circle cx="908.8" cy="414.7" r="6" class="s240 fill"/><circle cx="141.2" cy="198.4" r="6" class="s270 fill"/><circle cx="494.3" cy="235.6" r="6" class="s270 fill"/><circle cx="908.8" cy="292.5" r="6" class="s270 fill"/><circle cx="141.2" cy="100.2" r="6" class="s300 fill"/><circle cx="494.3" cy="117.2" r="6" class="s300 fill"/><circle cx="908.8" cy="161.2" r="6" class="s300 fill"/>
<text x="500.0" y="538" text-anchor="middle">Bypass ratio (BPR)</text>
<text x="24" y="280.0" text-anchor="middle" transform="rotate(-90 24 280.0)">First centreline Sᵢ &gt; 1 location (m)</text>
<line x1="610" y1="28" x2="642" y2="28" class="s240 line"/><text x="652" y="34">240 K</text>
<line x1="730" y1="28" x2="762" y2="28" class="s270 line"/><text x="772" y="34">270 K</text>
<line x1="850" y1="28" x2="882" y2="28" class="s300 line"/><text x="892" y="34">300 K</text>
<text x="630" y="112" class="note">At BPR ≈ 10: 300 → 240 K moves onset ≈ 48 mm upstream</text>
</svg>