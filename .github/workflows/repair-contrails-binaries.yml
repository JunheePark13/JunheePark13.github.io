name: Repair contrails binary assets

on:
  push:
    branches:
      - repair-contrails-binary-assets
    paths:
      - '.github/workflows/repair-contrails-binaries.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate v9 image payloads
        shell: bash
        run: |
          set -euo pipefail
          source_commit=811ed58d7c58916775a9228fb9a4745e3a039366

          rebuild() {
            src="$1"
            dest="$2"
            mapfile -t parts < <(git ls-tree -r --name-only "$source_commit" ".github/contrails-payloads/v9/$src" | sort)
            if [ "${#parts[@]}" -eq 0 ]; then
              echo "No parts found for $src" >&2
              exit 1
            fi
            echo "$src: ${#parts[@]} payload parts"
            for part in "${parts[@]}"; do
              git show "$source_commit:$part"
            done | tr -d '[:space:]' | base64 --decode > "$dest"
          }

          rebuild temperature images/contrails-les-temperature.webp
          rebuild density images/contrails-les-density.webp
          rebuild si-mean images/contrails-les-si-mean.webp

          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('images/contrails-les-temperature.webp'),
              Path('images/contrails-les-density.webp'),
              Path('images/contrails-les-si-mean.webp'),
          ]
          for path in files:
              data = path.read_bytes()
              if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'{path}: invalid WebP header')
              declared = int.from_bytes(data[4:8], 'little') + 8
              if declared != len(data):
                  raise SystemExit(f'{path}: RIFF size mismatch: declared {declared}, actual {len(data)}')
              print(f'{path}: valid RIFF/WebP container, {len(data)} bytes')
          PY

          file images/contrails-les-temperature.webp images/contrails-les-density.webp images/contrails-les-si-mean.webp
          identify images/contrails-les-temperature.webp images/contrails-les-density.webp images/contrails-les-si-mean.webp

      - name: Commit repaired binaries and remove temporary repair files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/contrails .tmp/q80test
          rm -f .github/workflows/repair-contrails-binaries.yml
          git config user.name 'JunheePark13'
          git config user.email '7773park@gmail.com'
          git add -A
          git commit -m 'Repair corrupted contrails image binaries'
          git push
