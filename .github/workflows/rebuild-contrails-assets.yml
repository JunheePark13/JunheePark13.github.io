name: Rebuild contrails image assets

on:
  push:
    paths:
      - '.github/workflows/rebuild-contrails-assets.yml'

permissions:
  contents: write

jobs:
  rebuild-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and decode contrails payloads
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for spec in \
            'temperature:images/contrails-v7-temperature.b64:13876' \
            'density:images/contrails-v7-density.b64:14800' \
            'si-mean:images/contrails-v7-si-mean.b64:14320'
          do
            IFS=':' read -r name source expected <<< "$spec"
            target="images/contrails-les-${name}.webp"
            echo "--- $name ---"
            echo "payload characters: $(wc -c < "$source")"
            invalid="$(LC_ALL=C tr -d 'A-Za-z0-9+/=\r\n' < "$source" | wc -c)"
            echo "non-base64 characters: $invalid"
            if base64 --decode "$source" > "$target"; then
              actual="$(wc -c < "$target")"
              echo "decoded bytes: $actual (expected $expected)"
              file "$target"
              if [ "$actual" -ne "$expected" ]; then failed=1; fi
            else
              echo "DECODE FAILED for $source"
              failed=1
            fi
          done
          exit "$failed"

      - name: Commit repaired image binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/contrails-les-temperature.webp images/contrails-les-density.webp images/contrails-les-si-mean.webp
          if git diff --cached --quiet; then
            echo "Image binaries already match the verified payloads."
          else
            git commit -m "Repair contrails image binaries"
            git push
          fi
