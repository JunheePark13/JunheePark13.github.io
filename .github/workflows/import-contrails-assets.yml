name: Import contrails PDF assets

on:
  push:
    branches: ["main"]
    paths:
      - ".asset-import/complete"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble figures extracted from research report
        shell: bash
        run: |
          cat .asset-import/c2_* | base64 -d > /tmp/contrails-assets.zip
          rm -rf /tmp/contrails-assets
          mkdir -p /tmp/contrails-assets
          unzip -o /tmp/contrails-assets.zip -d /tmp/contrails-assets
          cp /tmp/contrails-assets/contrails-wedge-validation.png images/contrails-wedge-validation.png
          cp /tmp/contrails-assets/contrails-bypass-onset-table.png images/contrails-bypass-onset-table.png
          cp /tmp/contrails-assets/contrails-bypass-saturation-table.png images/contrails-bypass-saturation-table.png
          cp /tmp/contrails-assets/contrails-3d-rans-validation.png images/contrails-3d-rans-validation.png
          cp /tmp/contrails-assets/contrails-ogrid.jpg images/contrails-ogrid.jpg
          cp /tmp/contrails-assets/contrails-rans-informed-resolution.jpg images/contrails-rans-informed-resolution.jpg
          cp /tmp/contrails-assets/contrails-production-mesh.jpg images/contrails-production-mesh.jpg
          cp /tmp/contrails-assets/contrails-les-fields.jpg images/contrails-les-fields.jpg
          rm -rf .asset-import
          rm -f .github/workflows/import-contrails-assets.yml
      - name: Commit extracted figures
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add figures extracted from contrails research report"
          git push
