name: Import contrails PDF assets

on:
  push:
    branches: ["main"]
    paths:
      - ".asset-import/complete"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble figures extracted from research report
        shell: bash
        run: |
          cat .asset-import/wedge_* | base64 -d > images/contrails-wedge-validation.jpg
          cat .asset-import/ogrid_* | base64 -d > images/contrails-ogrid.jpg
          cat .asset-import/ransval_* | base64 -d > images/contrails-3d-rans-validation.jpg
          cat .asset-import/mesh_* | base64 -d > images/contrails-production-mesh.jpg
          cat .asset-import/les_* | base64 -d > images/contrails-les-fields.jpg
          rm -rf .asset-import
          rm -f .github/workflows/import-contrails-assets.yml
      - name: Commit extracted figures
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add figures extracted from contrails research report"
          git push
