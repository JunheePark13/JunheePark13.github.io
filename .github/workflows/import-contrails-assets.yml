name: Import contrails PDF assets

on:
  push:
    branches: ["main"]
    paths:
      - ".asset-import/complete"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add figures extracted from the summer report
        shell: bash
        run: |
          cat .asset-import/c2_* | base64 -d > /tmp/contrails-assets.zip
          rm -rf /tmp/contrails-assets && mkdir -p /tmp/contrails-assets
          unzip -o /tmp/contrails-assets.zip -d /tmp/contrails-assets
          cp /tmp/contrails-assets/*.jpg images/
          rm -rf .asset-import
          rm -f .github/workflows/import-contrails-assets.yml
      - name: Commit figures
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/contrails-wedge-validation.jpg images/contrails-3d-rans-validation.jpg images/contrails-ogrid.jpg images/contrails-production-mesh.jpg images/contrails-les-fields.jpg
          git add -u .asset-import .github/workflows/import-contrails-assets.yml
          git commit -m "Add figures extracted from contrails research report"
          git push
