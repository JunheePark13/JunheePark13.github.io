name: Extract PINN report figures

on:
  push:
    branches: ["main"]
    paths:
      - "documents/ODE PINN vs Num Meth.pdf"
      - "scripts/extract_pinn_figures.py"
      - ".github/workflows/extract-pinn-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyMuPDF
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Extract figures
        run: python scripts/extract_pinn_figures.py

      - name: Commit extracted figures and page update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/pinn-*.png projects/Brusselator.html
          if git diff --cached --quiet; then
            echo "No figure changes to commit."
          else
            git commit -m "Extract figures from PINN final report"
            git push
          fi
